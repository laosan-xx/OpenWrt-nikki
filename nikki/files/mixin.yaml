# Mixin File
# You can set any mihomo profile's config at here, it will mixin to the profile.
# Mixin file have lower priority than the LuCI mixin options.
#
# Mihomo's Wiki: https://wiki.metacubex.one
#
# For example:
#
# experimental: # experimental config
#   dialer-ip4p-convert: false # IP4P support
# listeners: # overwrite listeners
#   - name: shadowsocks
#     type: shadowsocks
#     listen: "::"
#     port: 12060
# nikki-proxies: # prepend proxies
#   - name: PROXY
#     type: ss
#     server: proxy.example.com
#     port: 443
#     cipher: chacha20-ietf-poly1305
#     password: password
# nikki-proxy-groups: # prepend proxy groups
#   - name: PROXY_GROUP
#     type: select
#     proxies:
#       - PROXY
# nikki-rules: # prepend rules
#   - DOMAIN,direct.example.com,DIRECT
#   - DOMAIN-SUFFIX,proxy.example.com,PROXY
rule-providers:
  category-ads-all:
    type: http
    behavior: domain
    format: mrs
    url: "https://gh.2026178.xyz/raw/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
    path: ./rules/category-ads-all.mrs
    interval: 604800

  tiktok:
    type: http
    behavior: domain
    format: mrs
    url: "https://gh.2026178.xyz/raw/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"
    path: ./rules/tiktok.mrs
    interval: 604800

  apple:
    type: http
    behavior: domain
    format: mrs
    url: "https://gh.2026178.xyz/raw/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"
    path: ./rules/apple.mrs
    interval: 604800

  cn_domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://gh.2026178.xyz/raw/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: ./rules/cn_domain.mrs
    interval: 604800

  cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://gh.2026178.xyz/raw/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
    path: ./rules/cn_ip.mrs
    interval: 604800