# Nikki 默认本地文件配置 (Local Profile)
# 本文件编译后会安装到 /etc/nikki/profiles/default.yaml
# 可在 LuCI -> Nikki -> 配置编辑器 中修改，修改后在 “App Config -> Choose Profile” 中选择 File:default.yaml
# 注意：本文件会与 LuCI 的 Mixin 配置合并后生成运行配置 /etc/nikki/run/config.yaml

# 代理服务器（proxies）：在此添加你的节点，字段写法参考 mihomo 文档
proxies: []

# 代理组：PROXY 为手动选择组，在 proxies 中填入上面的节点名称即可切换
proxy-groups:
  - name: "PROXY"
    type: "select"
    proxies: []

# ============================================================
# 分流规则（自上而下依次匹配）
#   广告拦截 → TikTok 走代理 → Apple / 国内域名 / 局域网 / 国内 IP 直连 → 其余走代理
# RULE-SET 引用的规则集由 /etc/nikki/mixin.yaml 中的 rule-providers 定义，
# 首次启动会自动下载 category-ads-all / tiktok / apple / cn_domain / cn_ip
# ============================================================
rules:
  - RULE-SET,category-ads-all,REJECT
  - RULE-SET,tiktok,PROXY
  - RULE-SET,apple,DIRECT
  - RULE-SET,cn_domain,DIRECT
  - GEOIP,lan,DIRECT,no-resolve
  - RULE-SET,cn_ip,DIRECT
  - MATCH,PROXY
