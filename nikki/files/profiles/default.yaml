# Nikki 默认本地文件配置 (Local Profile)
# 本文件编译后会安装到 /etc/nikki/profiles/default.yaml
# 可在 LuCI -> Nikki -> 配置编辑器 中修改，修改后在 “App Config -> Choose Profile” 中选择 File:default.yaml
# 注意：本文件会与 LuCI 的 Mixin 配置合并后生成运行配置 /etc/nikki/run/config.yaml

# 在此添加你的代理服务器（proxies），示例如下（按需取消注释并修改）：
# proxies:
#   - name: "example-ss"
#     type: vless
#     server: "server.example.com"
#     port: 443
#     uuid: "uuid"
#     tls: true
#     udp: true
#     servername: "server.example.com"
#     client-fingerprint: "chrome"
#     encryption: ""
#     alpn:
#       - h2
#       - http/1.1
#     network: ws
#     ws-opts:
#       path: "/"
#       v2ray-http-upgrade: true
#       v2ray-http-upgrade-fast-open: true
#       headers:
#         Host: "server.example.com"

  # ---------- VLESS (Reality / xtls-rprx-vision) ----------
  # - name: "VLESS-Reality-节点1"
  #   type: vless
  #   server: <服务器地址或域名>
  #   port: 443
  #   uuid: <UUID>
  #   tls: true
  #   servername: <SNI>
  #   flow: xtls-rprx-vision
  #   reality-opts:
  #     public-key: <Reality 公钥>
  #     short-id: <short-id>

  # ---------- Trojan ----------
  # - name: "Trojan-节点1"
  #   type: trojan
  #   server: <服务器地址或域名>
  #   port: 443
  #   password: <密码>
  #   sni: <域名>
  #   alpn:
  #     - h2
  #     - http/1.1

  # ---------- Shadowsocks ----------
  # - name: "SS-节点1"
  #   type: ss
  #   server: <服务器地址或域名>
  #   port: 8388
  #   cipher: aes-256-gcm
  #   password: <密码>

# 代理组
proxy-groups:
  - name: "PROXY"
    type: "select"
    proxies:
      - "DIRECT"

# ============================================================
# 分流规则：广告拦截 → 国内直连 → 其余走代理
# 依赖 geoip.dat / geosite.dat（Nikki 首次启动会自动下载）
# ============================================================
rules:
  - GEOSITE,category-ads-all,REJECT
  - GEOIP,CN,DIRECT
  - GEOSITE,cn,DIRECT
  - MATCH,PROXY
